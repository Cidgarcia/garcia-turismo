<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proposta Comercial de Transporte — Garcia Turismo</title>
    <link rel="stylesheet" href="./styles/variables.css" />
    <link rel="stylesheet" href="./styles/main.css" />
    <link rel="stylesheet" href="./styles/dashboard.css" />
    <style>
      @page {
        size: A4;
        margin: 12mm 14mm;
      }
      body {
        background: #f8fafc;
        color: #1e293b;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 20px;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .client-page {
        max-width: 840px;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 20px;
        padding: 36px 40px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      }
      .header-wrap {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        border-bottom: 2px solid #dc2626;
        padding-bottom: 18px;
        margin-bottom: 22px;
        gap: 16px;
      }
      .logo-img {
        height: 56px;
        width: auto;
        max-width: 240px;
        object-fit: contain;
        display: block;
      }
      .validity-tag {
        display: inline-block;
        background: #fef2f2;
        color: #991b1b;
        border: 1.5px solid #fecaca;
        border-radius: 10px;
        padding: 6px 14px;
        font-weight: 700;
        font-size: 12.5px;
        text-align: right;
      }
      .section-title {
        font-size: 12.5px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: #b91c1c;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .info-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
        background: #f8fafc;
        border-radius: 14px;
        padding: 16px 18px;
        border: 1px solid #e2e8f0;
        margin-bottom: 20px;
      }
      .info-item p.label {
        font-size: 10.5px;
        color: #64748b;
        font-weight: 700;
        text-transform: uppercase;
        margin: 0 0 2px 0;
      }
      .info-item p.value {
        font-size: 13.5px;
        color: #0f172a;
        font-weight: 600;
        margin: 0;
      }
      .pricing-banner {
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        color: #ffffff;
        border-radius: 16px;
        padding: 20px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }
      .pricing-banner .total-val {
        font-size: 30px;
        font-weight: 800;
        color: #f87171;
      }
      .pricing-banner .seat-val {
        font-size: 13px;
        color: #cbd5e1;
      }
      .seatmap-section {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px;
        margin-bottom: 20px;
        page-break-inside: avoid;
      }
      .conditions-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin-bottom: 18px;
      }
      .condition-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 12px;
        line-height: 1.5;
        color: #334155;
      }
      .rules-box {
        background: #f8fafc;
        border-left: 4px solid #dc2626;
        padding: 12px 16px;
        border-radius: 0 12px 12px 0;
        font-size: 12px;
        line-height: 1.55;
        color: #334155;
        margin-bottom: 20px;
        white-space: pre-line;
      }
      .footer-note {
        border-top: 1px solid #e2e8f0;
        padding-top: 16px;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        font-size: 11.5px;
        color: #475569;
        margin-top: 24px;
      }
      .no-print-bar {
        max-width: 840px;
        margin: 0 auto 16px auto;
        display: flex;
        justify-content: flex-end;
        gap: 10px;
      }
      @media print {
        body {
          background: #ffffff;
          padding: 0;
        }
        .client-page {
          box-shadow: none;
          padding: 0;
          max-width: 100%;
        }
        .no-print-bar {
          display: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="no-print-bar">
      <button onclick="window.print()" class="rounded-2xl px-5 py-2.5 btn-primary font-semibold text-sm">
        Imprimir / Salvar PDF do Cliente
      </button>
    </div>

    <main class="client-page" id="clientDocRoot">
      <p style="text-align: center; padding: 40px; color: #64748b;">Carregando proposta comercial...</p>
    </main>

    <script type="module">
      import { generateSeatMapSVG } from "./src/components/seat-map.js";
      import { addDaysISO, formatDateBR } from "./src/utils/orcamento-calculator.js";

      window.__GARCIA_PDF_READY__ = false;

      function escapeHtml(val = "") {
        return String(val || "").replace(/[&<>'"]/g, (c) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          "'": "&#39;",
          '"': "&quot;",
        })[c]);
      }

      function money(val = 0) {
        return Number(val || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
      }

      function formatDateAndTime(dateIso, timeStr) {
        if (!dateIso) return "-";
        if (dateIso.includes("T")) {
          const [d, t] = dateIso.split("T");
          return `${formatDateBR(d)}${t ? ` às ${t}` : ""}`;
        }
        return `${formatDateBR(dateIso)}${timeStr ? ` às ${timeStr}` : ""}`;
      }

      // SEGURANÇA: Filtra apenas campos comerciais para o documento do cliente (NUNCA inclui custos ou margem)
      function sanitizeClientPayload(raw) {
        if (!raw) return null;

        const emissaoIso = raw.emissaoDate || raw.emissionDate || raw.dataEmissao || "";
        const diasValidade = Number(raw.validadeDias || raw.diasValidade || 7);
        const dataValidade = raw.dataValidade || (emissaoIso ? addDaysISO(emissaoIso, diasValidade) : "");

        return {
          id: raw.id,
          numeroSequencial: raw.orcamentoNum || raw.numeroSequencial || "-",
          responsavel: raw.responsible || "Garcia Turismo",
          cliente: raw.client || raw.cliente || "Cliente",
          clienteTelefone: raw.clientPhone || raw.clienteTelefone || "",
          numeroPassageiros: Number(raw.passengers || raw.numeroPassageiros || 0),
          capacidadeTotal: Number(raw.totalCapacity || raw.veiculo?.capacidade || raw.passengers || 46),
          quantidadeVeiculos: Number(raw.vehiclesQty || 1),
          origem: raw.origin || raw.origem || "",
          localEmbarque: raw.boardingPlace || "",
          destino: raw.destination || raw.destino || "",
          paradas: Array.isArray(raw.stops) ? raw.stops.join(" → ") : (raw.paradas || ""),
          dataIda: raw.departureDate || raw.dataHoraIda || "",
          horaIda: raw.departureTime || "",
          dataVolta: raw.returnDate || raw.dataHoraVolta || "",
          horaVolta: raw.returnTime || "",
          duracaoDias: Number(raw.durationDays || 1),
          veiculo: raw.veiculo || null,
          valorBruto: Number(raw.baseValue || raw.valorCobrado || 0),
          desconto: Number(raw.discount || 0),
          valorCobrado: Number(raw.finalValue ?? raw.valorCobrado ?? 0),
          sinalPrevisto: Number(raw.depositSignalValue || 0),
          sinalPago: Number(raw.depositPaidValue || 0),
          vencimentoSaldo: raw.balanceDueDate || "",
          dataEmissao: emissaoIso,
          diasValidade,
          dataValidade,
          condicoesComerciais: {
            formaPagamento: raw.paymentTerms || raw.condicoesComerciais?.formaPagamento || "",
            incluso: raw.included || raw.condicoesComerciais?.incluso || "",
            naoIncluso: raw.notIncluded || raw.condicoesComerciais?.naoIncluso || "",
            regrasGerais: raw.rules || raw.regrasViagem || raw.condicoesComerciais?.regrasGerais || "",
            politicaCancelamento: raw.cancellationPolicy || "",
          },
        };
      }

      function loadData() {
        if (window.__GARCIA_ORCAMENTO__) return sanitizeClientPayload(window.__GARCIA_ORCAMENTO__);
        const params = new URLSearchParams(window.location.search);
        const orcId = params.get("id");
        try {
          const rawSession = localStorage.getItem("garcia_turismo_state_backup");
          if (rawSession) {
            const state = JSON.parse(rawSession);
            const found = (state?.data?.trips || []).find((o) => !orcId || o.id === orcId);
            if (found) {
              const veiculos = (state?.data?.vehicles || []).filter((v) =>
                (found.vehicleIds || []).includes(v.id),
              );
              if (veiculos.length) {
                const veiculoNome = veiculos
                  .map((v) => `${v.nome || v.modelo}${v.placa ? ` (${v.placa})` : ""}`)
                  .join(" • ");
                const capacidade =
                  veiculos.reduce((acc, v) => acc + Number(v.capacidade || v.lugares || 0), 0) || 46;
                const layout = veiculos[0]?.layout || "onibus_46";
                const tipo = veiculos[0]?.tipo || "onibus";
                found.veiculo = { nome: veiculoNome, capacidade, layout, tipo };
              }
              return sanitizeClientPayload(found);
            }
          }
          const fallbackCurrent = localStorage.getItem("garcia_turismo_current_orcamento");
          if (fallbackCurrent) {
            return sanitizeClientPayload(JSON.parse(fallbackCurrent));
          }
        } catch (e) {
          console.warn(e);
        }
        return null;
      }

      function render() {
        const doc = loadData();
        const root = document.getElementById("clientDocRoot");

        if (!doc) {
          root.innerHTML = `
            <div style="text-align:center; padding: 40px;">
              <h2 style="color: #dc2626;">Proposta não encontrada</h2>
              <p style="color: #64748b;">Nenhum dado comercial disponível para esta proposta.</p>
            </div>
          `;
          window.__GARCIA_PDF_READY__ = true;
          return;
        }

        const totalPassageiros = doc.numeroPassageiros || doc.capacidadeTotal || 44;
        const valorPorPassageiro = totalPassageiros > 0 ? doc.valorCobrado / totalPassageiros : 0;
        const veiculoNome = doc.veiculo?.nome
          ? `${doc.veiculo.nome} (${doc.veiculo.capacidade || doc.capacidadeTotal} lugares)`
          : `${doc.quantidadeVeiculos} veículo(s) (${doc.capacidadeTotal} lugares)`;

        const seatMapSvg = generateSeatMapSVG({
          tipo: doc.veiculo?.tipo || "onibus",
          layout: doc.veiculo?.layout || "onibus_46",
          capacidade: doc.veiculo?.capacidade || doc.capacidadeTotal || totalPassageiros,
          showLegend: true,
        });

        const saldoRestante = Math.max(0, doc.valorCobrado - doc.sinalPago);

        root.innerHTML = `
          <header class="header-wrap">
            <div>
              <img src="./assets/garcia-turismo-report.png" alt="Garcia Turismo" class="logo-img" />
              <p style="font-size: 11.5px; color: #64748b; margin: 6px 0 0 0;">Fretamento Turístico, Executivo &amp; Logística de Passageiros</p>
            </div>
            <div style="text-align: right;">
              <div class="validity-tag">
                Válida até ${escapeHtml(formatDateBR(doc.dataValidade))} (${doc.diasValidade} dias)
              </div>
              <p style="font-size: 12px; color: #475569; margin: 6px 0 0 0;">
                Proposta <strong>#${escapeHtml(doc.numeroSequencial)}</strong> · Emissão: ${escapeHtml(formatDateBR(doc.dataEmissao))}
              </p>
            </div>
          </header>

          <div class="section-title">Roteiro &amp; Dados da Viagem</div>
          <div class="info-grid">
            <div class="info-item">
              <p class="label">Cliente / Contratante</p>
              <p class="value">${escapeHtml(doc.cliente)}</p>
              ${doc.clienteTelefone ? `<p style="font-size: 12px; color: #64748b; margin: 2px 0 0;">WhatsApp: ${escapeHtml(doc.clienteTelefone)}</p>` : ""}
            </div>
            <div class="info-item">
              <p class="label">Responsável Comercial</p>
              <p class="value">${escapeHtml(doc.responsavel)}</p>
              <p style="font-size: 12px; color: #64748b; margin: 2px 0 0;">Frota: ${escapeHtml(veiculoNome)}</p>
            </div>
            <div class="info-item">
              <p class="label">Saída / Embarque</p>
              <p class="value">${escapeHtml(formatDateAndTime(doc.dataIda, doc.horaIda))}</p>
              <p style="font-size: 12px; color: #64748b; margin: 2px 0 0;">
                ${escapeHtml(doc.origem)}${doc.localEmbarque ? ` — ${escapeHtml(doc.localEmbarque)}` : ""}
              </p>
            </div>
            <div class="info-item">
              <p class="label">Retorno Previsto (${doc.duracaoDias} dia(s))</p>
              <p class="value">${escapeHtml(formatDateAndTime(doc.dataVolta, doc.horaVolta))}</p>
              <p style="font-size: 12px; color: #64748b; margin: 2px 0 0;">Destino: ${escapeHtml(doc.destino)}</p>
            </div>
            ${
              doc.paradas
                ? `<div class="info-item" style="grid-column: span 2;">
                    <p class="label">Escalas / Roteiro Intermediário</p>
                    <p class="value">${escapeHtml(doc.paradas)}</p>
                  </div>`
                : ""
            }
          </div>

          <div class="pricing-banner">
            <div>
              <p style="font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.8px; color: #cbd5e1; margin: 0 0 4px 0;">Valor Final da Proposta</p>
              <div class="total-val">${money(doc.valorCobrado)}</div>
              ${
                doc.desconto > 0
                  ? `<div style="font-size: 12px; color: #86efac; margin-top: 4px;">Valor bruto: ${money(doc.valorBruto)} · Desconto aplicado: -${money(doc.desconto)}</div>`
                  : ""
              }
            </div>
            <div style="text-align: right;">
              <p style="font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.8px; color: #cbd5e1; margin: 0 0 4px 0;">Valor por Passageiro</p>
              <div style="font-size: 21px; font-weight: 700; color: #ffffff;">
                ${money(valorPorPassageiro)} <span style="font-size: 12px; font-weight: normal; color: #cbd5e1;">/ passageiro</span>
              </div>
              <div class="seat-val">${doc.numeroPassageiros > 0 ? `${doc.numeroPassageiros} passageiros previstos` : `Capacidade: ${doc.capacidadeTotal} lugares`}</div>
            </div>
          </div>

          <div class="section-title">Serviços Contratados &amp; Condições Comerciais</div>
          <div class="conditions-grid">
            <div class="condition-card">
              <strong style="color: #15803d; display: block; margin-bottom: 4px;">✓ O QUE ESTÁ INCLUSO</strong>
              <div style="white-space: pre-line;">${escapeHtml(doc.condicoesComerciais.incluso || "Transporte fretado conforme roteiro contratado.")}</div>
            </div>
            <div class="condition-card">
              <strong style="color: #b91c1c; display: block; margin-bottom: 4px;">✕ O QUE NÃO ESTÁ INCLUSO</strong>
              <div style="white-space: pre-line;">${escapeHtml(doc.condicoesComerciais.naoIncluso || "Despesas pessoais, ingressos e itens não especificados.")}</div>
            </div>
          </div>

          <div class="condition-card" style="margin-bottom: 18px;">
            <div><strong>Forma de Pagamento:</strong> ${escapeHtml(doc.condicoesComerciais.formaPagamento || "A combinar.")}</div>
            ${
              doc.sinalPrevisto > 0 || doc.sinalPago > 0 || doc.vencimentoSaldo
                ? `<div style="margin-top: 6px;">
                    ${doc.sinalPrevisto > 0 ? `Sinal previsto: <strong>${money(doc.sinalPrevisto)}</strong> · ` : ""}
                    ${doc.sinalPago > 0 ? `Sinal pago: <strong>${money(doc.sinalPago)}</strong> · Saldo restante: <strong>${money(saldoRestante)}</strong> · ` : ""}
                    ${doc.vencimentoSaldo ? `Vencimento do saldo: <strong>${escapeHtml(formatDateBR(doc.vencimentoSaldo))}</strong>` : ""}
                  </div>`
                : ""
            }
          </div>

          <div class="section-title">Regras de Viagem &amp; Cancelamento</div>
          <div class="rules-box">${escapeHtml(doc.condicoesComerciais.regrasGerais || "Tolerância de atraso no embarque: 15 minutos.")}${doc.condicoesComerciais.politicaCancelamento ? `\n\nPolítica de Reserva e Cancelamento:\n${escapeHtml(doc.condicoesComerciais.politicaCancelamento)}` : ""}</div>

          <div class="section-title">Mapa Esquemático de Poltronas</div>
          <div class="seatmap-section">
            ${seatMapSvg}
          </div>

          <footer class="footer-note">
            <div>
              <strong>Garcia Turismo</strong> · Juazeiro-BA / Petrolina-PE<br />
              WhatsApp: (74) 98816-4009 · E-mail: garciaturismoeviagens@gmail.com
            </div>
            <div style="text-align: center; min-width: 240px;">
              <div style="border-bottom: 1px solid #334155; height: 24px; margin-bottom: 4px;"></div>
              <span>Assinatura do Contratante / Data</span>
            </div>
          </footer>
        `;

        window.__GARCIA_PDF_READY__ = true;
      }

      window.addEventListener("DOMContentLoaded", render);
    </script>
  </body>
</html>
