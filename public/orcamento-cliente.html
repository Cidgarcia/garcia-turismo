<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proposta Comercial de Transporte — Garcia Turismo</title>
    <link rel="stylesheet" href="./styles/variables.css" />
    <link rel="stylesheet" href="./styles/main.css" />
    <link rel="stylesheet" href="./styles/dashboard.css" />
    <style>
      @page {
        size: A4;
        margin: 12mm 14mm;
      }
      body {
        background: #f8fafc;
        color: #1e293b;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 20px;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .client-page {
        max-width: 840px;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 20px;
        padding: 36px 40px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      }
      .header-wrap {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        border-bottom: 2px solid #dc2626;
        padding-bottom: 18px;
        margin-bottom: 22px;
        gap: 16px;
      }
      .logo-img {
        height: 56px;
        width: auto;
        max-width: 240px;
        object-fit: contain;
        display: block;
      }
      .validity-tag {
        display: inline-block;
        background: #fef2f2;
        color: #991b1b;
        border: 1.5px solid #fecaca;
        border-radius: 10px;
        padding: 6px 14px;
        font-weight: 700;
        font-size: 12.5px;
        text-align: right;
      }
      .section-title {
        font-size: 12.5px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: #b91c1c;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .info-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
        background: #f8fafc;
        border-radius: 14px;
        padding: 16px 18px;
        border: 1px solid #e2e8f0;
        margin-bottom: 20px;
      }
      .info-item p.label {
        font-size: 10.5px;
        color: #64748b;
        font-weight: 700;
        text-transform: uppercase;
        margin: 0 0 2px 0;
      }
      .info-item p.value {
        font-size: 13.5px;
        color: #0f172a;
        font-weight: 600;
        margin: 0;
      }
      .pricing-banner {
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        color: #ffffff;
        border-radius: 16px;
        padding: 20px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }
      .pricing-banner .total-val {
        font-size: 30px;
        font-weight: 800;
        color: #f87171;
      }
      .pricing-banner .seat-val {
        font-size: 13px;
        color: #cbd5e1;
      }
      .seatmap-section {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px;
        margin-bottom: 20px;
        page-break-inside: avoid;
      }
      .conditions-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin-bottom: 18px;
      }
      .condition-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 12px;
        line-height: 1.5;
        color: #334155;
      }
      .rules-box {
        background: #f8fafc;
        border-left: 4px solid #dc2626;
        padding: 12px 16px;
        border-radius: 0 12px 12px 0;
        font-size: 12px;
        line-height: 1.55;
        color: #334155;
        margin-bottom: 20px;
        white-space: pre-line;
      }
      .footer-note {
        border-top: 1px solid #e2e8f0;
        padding-top: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        font-size: 11px;
        color: #64748b;
        margin-top: 12px;
      }
      .digital-signatures-section {
        margin-top: 22px;
        padding-top: 16px;
        border-top: 2px solid #e2e8f0;
        break-inside: avoid;
        page-break-inside: avoid;
        -webkit-column-break-inside: avoid;
      }
      .digital-signatures-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 12px;
      }
      .digital-signatures-badge {
        font-size: 11.5px;
        font-weight: 600;
        color: #475569;
        background: #f1f5f9;
        border: 1px solid #cbd5e1;
        border-radius: 999px;
        padding: 4px 12px;
      }
      .digital-signatures-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }
      .digital-signature-card {
        background: #f8fafc;
        border: 1px solid #cbd5e1;
        border-radius: 14px;
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        break-inside: avoid;
        page-break-inside: avoid;
        -webkit-column-break-inside: avoid;
      }
      .digital-signature-meta {
        font-size: 12px;
        line-height: 1.55;
        color: #1e293b;
        margin-bottom: 12px;
      }
      .digital-signature-role {
        font-size: 11px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        color: #b91c1c;
        margin-bottom: 6px;
      }
      .digital-signature-box {
        min-height: 80px;
        border: 1.5px dashed #94a3b8;
        border-radius: 10px;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 10px;
        text-align: center;
      }
      .no-print-bar {
        max-width: 840px;
        margin: 0 auto 16px auto;
        display: flex;
        justify-content: flex-end;
        gap: 10px;
      }
      @media print {
        body {
          background: #ffffff;
          padding: 0;
        }
        .client-page {
          box-shadow: none;
          padding: 0;
          max-width: 100%;
        }
        .no-print-bar {
          display: none !important;
        }
        .digital-signatures-section,
        .digital-signature-card,
        .seatmap-section,
        .conditions-grid {
          break-inside: avoid !important;
          page-break-inside: avoid !important;
          -webkit-column-break-inside: avoid !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="no-print-bar">
      <button id="printClientDocBtn" type="button" class="rounded-2xl px-4 py-2.5 btn-secondary font-semibold text-sm">
        Imprimir
      </button>
      <button id="downloadClientPdfBtn" type="button" class="rounded-2xl px-5 py-2.5 btn-primary font-semibold text-sm">
        Baixar arquivo PDF
      </button>
    </div>

    <main class="client-page" id="clientDocRoot">
      <p style="text-align: center; padding: 40px; color: #64748b;">Carregando proposta comercial...</p>
    </main>

    <script type="module">
      import { generateSeatMapSVG } from "./src/components/seat-map.js";
      import { addDaysISO, formatDateBR } from "./src/utils/orcamento-calculator.js";

      window.__GARCIA_PDF_READY__ = false;

      function escapeHtml(val = "") {
        return String(val || "").replace(/[&<>'"]/g, (c) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          "'": "&#39;",
          '"': "&quot;",
        })[c]);
      }

      function money(val = 0) {
        return Number(val || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
      }

      function formatDateAndTime(dateIso, timeStr) {
        if (!dateIso) return "-";
        if (dateIso.includes("T")) {
          const [d, t] = dateIso.split("T");
          return `${formatDateBR(d)}${t ? ` às ${t}` : ""}`;
        }
        return `${formatDateBR(dateIso)}${timeStr ? ` às ${timeStr}` : ""}`;
      }

      const CONTRATADA_LEGAL_INFO = Object.freeze({
        razaoSocial: "GARCIA CONSTRUÇÕES E TURISMO LTDA",
        cnpj: "62.355.676/0001-55",
        representantePadrao: "Cid Augusto Garcia de Souza Junior",
      });

      const DEFAULT_CLAUSES = Object.freeze({
        formaPagamento:
          "Sinal de 30% no ato da confirmação para bloqueio de agenda e saldo restante quitado até 5 (cinco) dias antes do embarque (ou na data de vencimento acordada). A saída do veículo fica condicionada à quitação integral prévia. Desvios de rota, km excedente ou extensão de horário solicitados pelo CONTRATANTE dependerão de viabilidade operacional/legal e serão cobrados à parte.",
        incluso:
          "Transporte fretado ida e volta conforme itinerário contratado, combustível, motorista(s) habilitado(s), pedágios previstos na rota original e taxas regulares de rodagem.",
        naoIncluso:
          "Hospedagem e alimentação de passageiros, ingressos, taxas turísticas/ambientais municipais, balsas, estacionamentos não previstos na proposta e deslocamentos extras fora do roteiro contratado.",
        regrasGerais:
          "- ATRASOS: Tolerância de até 30 minutos nos horários de embarque e retorno. Atrasos superiores do grupo poderão exigir readequação do roteiro (respeitando o descanso legal do motorista) e cobrança de hora parada/diária extra. A CONTRATADA não responde por atrasos causados por trânsito, interdições de vias, clima ou fiscalizações; em caso de falha mecânica, providenciará reparo ou substituição por veículo compatível em tempo hábil.\n- DANOS E CONSERVAÇÃO: O CONTRATANTE responde por danos causados ao veículo, poltronas, vidros, equipamentos ou sanitário pelos passageiros (facultada vistoria no início e término), com reembolso mediante orçamento/nota fiscal em até 5 dias úteis, além de taxa de higienização especial em caso de sujeira extrema. Proibido fumar, consumir álcool em excesso ou exceder a lotação de poltronas.\n- RESPONSABILIDADES: A CONTRATADA fornecerá veículo limpo, revisado e regularizado. O CONTRATANTE deve enviar a lista oficial de passageiros (nome e documento) até 48h antes da saída e garantir o porte de documentos originais e autorizações de menores. Bagagem: 1 mala no bagageiro e 1 volume de mão por passageiro (objetos de valor no salão durante paradas ficam sob guarda exclusiva do passageiro).",
        politicaCancelamento:
          "- RESERVA E INADIMPLÊNCIA: O bloqueio do veículo somente se confirma após compensação do sinal. O não pagamento do saldo até o vencimento faculta à CONTRATADA cancelar a viagem após aviso prévio de 24h, aplicando-se as retenções abaixo.\n- CANCELAMENTO PELO CONTRATANTE: (a) Com 30 dias ou mais antes do embarque: retenção de 20% sobre o sinal para custos administrativos e reembolso de 80% em até 10 dias úteis (ou crédito integral para remarcação em até 90 dias, conforme disponibilidade); (b) Entre 15 e 29 dias antes: retenção de 50% do sinal pago; (c) Com menos de 15 dias do embarque ou não comparecimento (no-show): retenção de 100% do sinal (limitada a 30% do valor total do contrato).\n- CANCELAMENTO PELA CONTRATADA OU FORÇA MAIOR: Havendo cancelamento por culpa exclusiva da CONTRATADA sem oferta de veículo equivalente, haverá devolução integral (100%) dos valores pagos em até 5 dias úteis. Em caso de força maior (interdição oficial de vias ou calamidade), a viagem poderá ser remarcada sem multa, sujeita à disponibilidade de frota.",
      });

      function parseSignatureMeta(raw) {
        if (raw?.clientDoc || raw?.clientRepresentative || raw?.clienteDocumento || raw?.clienteRepresentante) {
          return {
            clientDoc: String(raw.clientDoc || raw.clienteDocumento || "").trim(),
            clientRepresentative: String(raw.clientRepresentative || raw.clienteRepresentante || "").trim(),
          };
        }
        const notes = String(raw?.paymentInstallmentNotes || "").trim();
        if (notes.startsWith("{")) {
          try {
            const parsed = JSON.parse(notes);
            if (parsed && parsed.sigMeta === 1) {
              return {
                clientDoc: String(parsed.clientDoc || "").trim(),
                clientRepresentative: String(parsed.clientRepresentative || "").trim(),
              };
            }
          } catch {
            // ignore
          }
        }
        return { clientDoc: "", clientRepresentative: "" };
      }

      // SEGURANÇA: Filtra apenas campos comerciais para o documento do cliente (NUNCA inclui custos ou margem)
      function sanitizeClientPayload(raw) {
        if (!raw) return null;

        const emissaoIso = raw.emissaoDate || raw.emissionDate || raw.dataEmissao || "";
        const diasValidade = Number(raw.validadeDias || raw.diasValidade || 7);
        const dataValidade = raw.dataValidade || (emissaoIso ? addDaysISO(emissaoIso, diasValidade) : "");
        const sigMeta = parseSignatureMeta(raw);

        return {
          id: raw.id,
          numeroSequencial: raw.orcamentoNum || raw.numeroSequencial || "-",
          responsavel: raw.responsible || CONTRATADA_LEGAL_INFO.representantePadrao,
          cliente: raw.client || raw.cliente || "Cliente",
          clienteTelefone: raw.clientPhone || raw.clienteTelefone || "",
          clienteDocumento: sigMeta.clientDoc,
          clienteRepresentante: sigMeta.clientRepresentative,
          numeroPassageiros: Number(raw.passengers || raw.numeroPassageiros || 0),
          capacidadeTotal: Number(raw.totalCapacity || raw.veiculo?.capacidade || raw.passengers || 46),
          quantidadeVeiculos: Number(raw.vehiclesQty || 1),
          origem: raw.origin || raw.origem || "",
          localEmbarque: raw.boardingPlace || "",
          destino: raw.destination || raw.destino || "",
          paradas: Array.isArray(raw.stops) ? raw.stops.join(" → ") : (raw.paradas || ""),
          dataIda: raw.departureDate || raw.dataHoraIda || "",
          horaIda: raw.departureTime || "",
          dataVolta: raw.returnDate || raw.dataHoraVolta || "",
          horaVolta: raw.returnTime || "",
          duracaoDias: Number(raw.durationDays || 1),
          veiculo: raw.veiculo || null,
          valorBruto: Number(raw.baseValue || raw.valorCobrado || 0),
          desconto: Number(raw.discount || 0),
          valorCobrado: Number(raw.finalValue ?? raw.valorCobrado ?? 0),
          sinalPrevisto: Number(raw.depositSignalValue || 0),
          sinalPago: Number(raw.depositPaidValue || 0),
          vencimentoSaldo: raw.balanceDueDate || "",
          dataEmissao: emissaoIso,
          diasValidade,
          dataValidade,
          condicoesComerciais: {
            formaPagamento: raw.paymentTerms || raw.condicoesComerciais?.formaPagamento || DEFAULT_CLAUSES.formaPagamento,
            incluso: raw.included || raw.condicoesComerciais?.incluso || DEFAULT_CLAUSES.incluso,
            naoIncluso: raw.notIncluded || raw.condicoesComerciais?.naoIncluso || DEFAULT_CLAUSES.naoIncluso,
            regrasGerais: raw.rules || raw.regrasViagem || raw.condicoesComerciais?.regrasGerais || DEFAULT_CLAUSES.regrasGerais,
            politicaCancelamento: raw.cancellationPolicy || DEFAULT_CLAUSES.politicaCancelamento,
          },
        };
      }

      function loadData() {
        if (window.__GARCIA_ORCAMENTO__) return sanitizeClientPayload(window.__GARCIA_ORCAMENTO__);
        const params = new URLSearchParams(window.location.search);
        const orcId = params.get("id");
        try {
          const rawSession = localStorage.getItem("garcia_turismo_state_backup");
          if (rawSession) {
            const state = JSON.parse(rawSession);
            const found = (state?.data?.trips || []).find((o) => !orcId || o.id === orcId);
            if (found) {
              const veiculos = (state?.data?.vehicles || []).filter((v) =>
                (found.vehicleIds || []).includes(v.id),
              );
              if (veiculos.length) {
                const veiculoNome = veiculos
                  .map((v) => `${v.nome || v.modelo}${v.placa ? ` (${v.placa})` : ""}`)
                  .join(" • ");
                const capacidade =
                  veiculos.reduce((acc, v) => acc + Number(v.capacidade || v.lugares || 0), 0) || 46;
                const layout = veiculos[0]?.layout || "onibus_46";
                const tipo = veiculos[0]?.tipo || "onibus";
                found.veiculo = { nome: veiculoNome, capacidade, layout, tipo };
              }
              return sanitizeClientPayload(found);
            }
          }
          const fallbackCurrent = localStorage.getItem("garcia_turismo_current_orcamento");
          if (fallbackCurrent) {
            return sanitizeClientPayload(JSON.parse(fallbackCurrent));
          }
        } catch (e) {
          console.warn(e);
        }
        return null;
      }

      function render() {
        const doc = loadData();
        const root = document.getElementById("clientDocRoot");

        if (!doc) {
          root.innerHTML = `
            <div style="text-align:center; padding: 40px;">
              <h2 style="color: #dc2626;">Proposta não encontrada</h2>
              <p style="color: #64748b;">Nenhum dado comercial disponível para esta proposta.</p>
            </div>
          `;
          window.__GARCIA_PDF_READY__ = true;
          return;
        }

        const totalPassageiros = doc.numeroPassageiros || doc.capacidadeTotal || 44;
        const valorPorPassageiro = totalPassageiros > 0 ? doc.valorCobrado / totalPassageiros : 0;
        const veiculoNome = doc.veiculo?.nome
          ? `${doc.veiculo.nome} (${doc.veiculo.capacidade || doc.capacidadeTotal} lugares)`
          : `${doc.quantidadeVeiculos} veículo(s) (${doc.capacidadeTotal} lugares)`;

        const seatMapSvg = generateSeatMapSVG({
          tipo: doc.veiculo?.tipo || "onibus",
          layout: doc.veiculo?.layout || "onibus_46",
          capacidade: doc.veiculo?.capacidade || doc.capacidadeTotal || totalPassageiros,
          showLegend: true,
        });

        const saldoRestante = Math.max(0, doc.valorCobrado - doc.sinalPago);

        root.innerHTML = `
          <header class="header-wrap">
            <div>
              <img src="./assets/garcia-turismo-report.png" alt="Garcia Turismo" class="logo-img" />
              <p style="font-size: 11.5px; color: #64748b; margin: 6px 0 0 0;">Fretamento Turístico, Executivo &amp; Logística de Passageiros</p>
            </div>
            <div style="text-align: right;">
              <div class="validity-tag">
                Válida até ${escapeHtml(formatDateBR(doc.dataValidade))} (${doc.diasValidade} dias)
              </div>
              <p style="font-size: 12px; color: #475569; margin: 6px 0 0 0;">
                Proposta <strong>#${escapeHtml(doc.numeroSequencial)}</strong> · Emissão: ${escapeHtml(formatDateBR(doc.dataEmissao))}
              </p>
            </div>
          </header>

          <div class="section-title">Roteiro &amp; Dados da Viagem</div>
          <div class="info-grid">
            <div class="info-item">
              <p class="label">Cliente / Contratante</p>
              <p class="value">${escapeHtml(doc.cliente)}</p>
              ${doc.clienteTelefone ? `<p style="font-size: 12px; color: #64748b; margin: 2px 0 0;">WhatsApp: ${escapeHtml(doc.clienteTelefone)}</p>` : ""}
            </div>
            <div class="info-item">
              <p class="label">Responsável Comercial</p>
              <p class="value">${escapeHtml(doc.responsavel)}</p>
              <p style="font-size: 12px; color: #64748b; margin: 2px 0 0;">Frota: ${escapeHtml(veiculoNome)}</p>
            </div>
            <div class="info-item">
              <p class="label">Saída / Embarque</p>
              <p class="value">${escapeHtml(formatDateAndTime(doc.dataIda, doc.horaIda))}</p>
              <p style="font-size: 12px; color: #64748b; margin: 2px 0 0;">
                ${escapeHtml(doc.origem)}${doc.localEmbarque ? ` — ${escapeHtml(doc.localEmbarque)}` : ""}
              </p>
            </div>
            <div class="info-item">
              <p class="label">Retorno Previsto (${doc.duracaoDias} dia(s))</p>
              <p class="value">${escapeHtml(formatDateAndTime(doc.dataVolta, doc.horaVolta))}</p>
              <p style="font-size: 12px; color: #64748b; margin: 2px 0 0;">Destino: ${escapeHtml(doc.destino)}</p>
            </div>
            ${
              doc.paradas
                ? `<div class="info-item" style="grid-column: span 2;">
                    <p class="label">Escalas / Roteiro Intermediário</p>
                    <p class="value">${escapeHtml(doc.paradas)}</p>
                  </div>`
                : ""
            }
          </div>

          <div class="pricing-banner">
            <div>
              <p style="font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.8px; color: #cbd5e1; margin: 0 0 4px 0;">Valor Final da Proposta</p>
              <div class="total-val">${money(doc.valorCobrado)}</div>
              ${
                doc.desconto > 0
                  ? `<div style="font-size: 12px; color: #86efac; margin-top: 4px;">Valor bruto: ${money(doc.valorBruto)} · Desconto aplicado: -${money(doc.desconto)}</div>`
                  : ""
              }
            </div>
            <div style="text-align: right;">
              <p style="font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.8px; color: #cbd5e1; margin: 0 0 4px 0;">Valor por Passageiro</p>
              <div style="font-size: 21px; font-weight: 700; color: #ffffff;">
                ${money(valorPorPassageiro)} <span style="font-size: 12px; font-weight: normal; color: #cbd5e1;">/ passageiro</span>
              </div>
              <div class="seat-val">${doc.numeroPassageiros > 0 ? `${doc.numeroPassageiros} passageiros previstos` : `Capacidade: ${doc.capacidadeTotal} lugares`}</div>
            </div>
          </div>

          <div class="section-title">Serviços Contratados &amp; Condições Comerciais</div>
          <div class="conditions-grid">
            <div class="condition-card">
              <strong style="color: #15803d; display: block; margin-bottom: 4px;">✓ O QUE ESTÁ INCLUSO</strong>
              <div style="white-space: pre-line;">${escapeHtml(doc.condicoesComerciais.incluso || "Transporte fretado conforme roteiro contratado.")}</div>
            </div>
            <div class="condition-card">
              <strong style="color: #b91c1c; display: block; margin-bottom: 4px;">✕ O QUE NÃO ESTÁ INCLUSO</strong>
              <div style="white-space: pre-line;">${escapeHtml(doc.condicoesComerciais.naoIncluso || "Despesas pessoais, ingressos e itens não especificados.")}</div>
            </div>
          </div>

          <div class="condition-card" style="margin-bottom: 18px;">
            <div><strong>Cláusula de Pagamento e Quitação:</strong> ${escapeHtml(doc.condicoesComerciais.formaPagamento)}</div>
            ${
              doc.sinalPrevisto > 0 || doc.sinalPago > 0 || doc.vencimentoSaldo
                ? `<div style="margin-top: 6px; padding-top: 6px; border-top: 1px dashed #cbd5e1;">
                    ${doc.sinalPrevisto > 0 ? `Sinal previsto: <strong>${money(doc.sinalPrevisto)}</strong> · ` : ""}
                    ${doc.sinalPago > 0 ? `Sinal pago: <strong>${money(doc.sinalPago)}</strong> · Saldo restante: <strong>${money(saldoRestante)}</strong> · ` : ""}
                    ${doc.vencimentoSaldo ? `Vencimento do saldo: <strong>${escapeHtml(formatDateBR(doc.vencimentoSaldo))}</strong>` : ""}
                  </div>`

            }
          </div>

          <div class="section-title">Atrasos, Danos, Responsabilidades &amp; Cancelamento</div>

          <div class="section-title">Mapa Esquemático de Poltronas</div>

            <div class="digital-signatures-grid">
              <div class="digital-signature-card">
                <div class="digital-signature-meta">
                  <div class="digital-signature-role">CONTRATANTE</div>

                  <div><strong>CPF / CNPJ:</strong> ${escapeHtml(doc.clienteDocumento || "A preencher")}</div>
                  <div><strong>Representante:</strong> ${escapeHtml(doc.clienteRepresentante || (doc.cliente && doc.cliente !== "Cliente" ? doc.cliente : "A preencher"))}</div>

                <div class="digital-signature-box">
                  <span style="font-size: 11px; font-weight: 700; color: #475569; text-transform: uppercase; letter-spacing: 0.4px;">Assinatura Digital — Contratante</span>

                </div>
              </div>

              <div class="digital-signature-card">
                <div class="digital-signature-meta">
                  <div class="digital-signature-role">CONTRATADA</div>
                  <div><strong>Razão Social:</strong> ${escapeHtml(CONTRATADA_LEGAL_INFO.razaoSocial)}</div>
                  <div><strong>CNPJ:</strong> ${escapeHtml(CONTRATADA_LEGAL_INFO.cnpj)}</div>
                  <div><strong>Representante:</strong> ${escapeHtml(doc.responsavel && doc.responsavel !== "Responsável" && doc.responsavel !== "Garcia Turismo" ? doc.responsavel : CONTRATADA_LEGAL_INFO.representantePadrao)}</div>

                <div class="digital-signature-box">
                  <span style="font-size: 11px; font-weight: 700; color: #475569; text-transform: uppercase; letter-spacing: 0.4px;">Assinatura Digital — Contratada</span>
                  <span style="font-size: 10.5px; color: #94a3b8; margin-top: 2px;">Espaço reservado para validação por plataforma eletrônica</span>
                </div>

            <footer class="footer-note">

              <div>

        `;

        window.__GARCIA_PDF_READY__ = true;
      }

      async function ensureHtml2Pdf() {
        if (typeof window.html2pdf === "function") return window.html2pdf;
        await new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = "https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js";
          script.onload = () => resolve();
          script.onerror = () => reject(new Error("Falha ao carregar biblioteca de PDF."));
          document.head.appendChild(script);
        });
        return window.html2pdf;
      }

      async function downloadClientPdf() {
        const btn = document.getElementById("downloadClientPdfBtn");
        const root = document.getElementById("clientDocRoot");
        const docData = loadData();
        const oldText = btn ? btn.textContent : "Baixar arquivo PDF";
        if (btn) {
          btn.disabled = true;
          btn.textContent = "Gerando PDF...";
        }
        const prevMaxWidth = root.style.maxWidth;
        const prevPadding = root.style.padding;
        const prevBoxShadow = root.style.boxShadow;
        try {
          const html2pdfLib = await ensureHtml2Pdf();
          root.style.maxWidth = "716px";
          root.style.padding = "22px 24px";
          root.style.boxShadow = "none";
          const cleanNum = String(docData?.numeroSequencial || "Cliente").replace(/[^a-zA-Z0-9_-]+/g, "_");
          await html2pdfLib()
            .set({
              margin: [0.25, 0.25, 0.25, 0.25],
              filename: `Proposta_Comercial_${cleanNum}.pdf`,
              image: { type: "jpeg", quality: 0.98 },
              html2canvas: { scale: 2, useCORS: true, scrollY: 0, backgroundColor: "#ffffff" },
              jsPDF: { unit: "in", format: "a4", orientation: "portrait" },
              pagebreak: {
                mode: ["css", "legacy"],
                avoid: [".digital-signatures-section", ".digital-signature-card", ".seatmap-section"],
              },
            })
            .from(root)
            .save();
        } catch (err) {
          console.error(err);
          window.print();
        } finally {
          root.style.maxWidth = prevMaxWidth;
          root.style.padding = prevPadding;
          root.style.boxShadow = prevBoxShadow;
          if (btn) {
            btn.disabled = false;
            btn.textContent = oldText;
          }
        }
      }

      window.addEventListener("DOMContentLoaded", () => {
        render();
        document.getElementById("printClientDocBtn")?.addEventListener("click", () => window.print());
        document.getElementById("downloadClientPdfBtn")?.addEventListener("click", downloadClientPdf);
      });
    </script>
  </body>
</html>
