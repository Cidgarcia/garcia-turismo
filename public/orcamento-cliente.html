<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proposta Comercial de Transporte — Garcia Turismo</title>
    <link rel="stylesheet" href="./styles/variables.css" />
    <link rel="stylesheet" href="./styles/main.css" />
    <link rel="stylesheet" href="./styles/dashboard.css" />
    <style>
      @page {
        size: A4;
        margin: 12mm 15mm;
      }
      body {
        background: #f8fafc;
        color: #1e293b;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 20px;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .client-page {
        max-width: 840px;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 20px;
        padding: 36px 40px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      }
      .header-wrap {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        border-bottom: 2px solid #e2e8f0;
        padding-bottom: 20px;
        margin-bottom: 24px;
      }
      .logo-img {
        max-height: 64px;
        object-fit: contain;
      }
      .validity-tag {
        display: inline-block;
        background: #ecfdf5;
        color: #065f46;
        border: 1.5px solid #a7f3d0;
        border-radius: 12px;
        padding: 8px 16px;
        font-weight: 700;
        font-size: 13px;
        text-align: right;
      }
      .section-title {
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #0284c7;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .info-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
        background: #f8fafc;
        border-radius: 16px;
        padding: 18px 20px;
        border: 1px solid #e2e8f0;
        margin-bottom: 24px;
      }
      .info-item p.label {
        font-size: 11px;
        color: #64748b;
        font-weight: 600;
        text-transform: uppercase;
        margin: 0 0 2px 0;
      }
      .info-item p.value {
        font-size: 14px;
        color: #0f172a;
        font-weight: 600;
        margin: 0;
      }
      .pricing-banner {
        background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
        color: #ffffff;
        border-radius: 18px;
        padding: 24px 28px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 28px;
      }
      .pricing-banner .total-val {
        font-size: 32px;
        font-weight: 800;
        color: #38bdf8;
      }
      .pricing-banner .seat-val {
        font-size: 14px;
        color: #cbd5e1;
      }
      .seatmap-section {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 18px;
        padding: 20px;
        margin-bottom: 24px;
        page-break-inside: avoid;
      }
      .rules-box {
        background: #f1f5f9;
        border-left: 4px solid #0284c7;
        padding: 14px 18px;
        border-radius: 0 12px 12px 0;
        font-size: 12px;
        line-height: 1.6;
        color: #334155;
        margin-bottom: 24px;
      }
      .conditions-list {
        font-size: 12.5px;
        line-height: 1.6;
        color: #334155;
        margin-bottom: 24px;
      }
      .conditions-list li {
        margin-bottom: 6px;
      }
      .footer-note {
        border-top: 1px solid #e2e8f0;
        padding-top: 16px;
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: #64748b;
        margin-top: 30px;
      }
      .no-print-bar {
        max-width: 840px;
        margin: 0 auto 16px auto;
        display: flex;
        justify-content: flex-end;
        gap: 10px;
      }
      @media print {
        body {
          background: #ffffff;
          padding: 0;
        }
        .client-page {
          box-shadow: none;
          padding: 0;
          max-width: 100%;
        }
        .no-print-bar {
          display: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="no-print-bar">
      <button onclick="window.print()" class="rounded-2xl px-5 py-2.5 btn-primary font-semibold text-sm">
        🖨️ Imprimir / Salvar PDF
      </button>
    </div>

    <main class="client-page" id="clientDocRoot">
      <p style="text-align: center; padding: 40px; color: #64748b;">Carregando proposta comercial...</p>
    </main>

    <script type="module">
      import { generateSeatMapSVG } from "./src/components/seat-map.js";
      import { formatDateBR } from "./src/utils/orcamento-calculator.js";

      window.__GARCIA_PDF_READY__ = false;

      function escapeHtml(val = "") {
        return String(val || "").replace(/[&<>'"]/g, (c) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;"
        })[c]);
      }

      function money(val = 0) {
        return Number(val || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
      }

      function formatDateTimeBR(isoDateTime) {
        if (!isoDateTime) return "-";
        const [date, time] = isoDateTime.split("T");
        return `${formatDateBR(date)} às ${time || "00:00"}`;
      }

      // SEGURANÇA: Função que filtra e elimina estritamente qualquer campo interno de custo
      function sanitizeClientPayload(raw) {
        if (!raw) return null;
        
        // Compute validity from emissaoDate + validadeDias using standard Date math
        let dataValidade = raw.emissaoDate || "";
        if (raw.emissaoDate && raw.validadeDias) {
            const date = new Date(raw.emissaoDate);
            date.setDate(date.getDate() + Number(raw.validadeDias));
            dataValidade = date.toISOString().slice(0, 10);
        }

        return {
          id: raw.id,
          numeroSequencial: raw.orcamentoNum || "",
          versao: raw.orcamentoVersao || 1,
          cliente: raw.client || "Cliente",
          numeroPassageiros: Number(raw.passengers || 40),
          origem: raw.origin || "",
          destino: raw.destination || "",
          paradas: (raw.stops || []).join("\n"),
          dataHoraIda: raw.departureDate || "",
          dataHoraVolta: raw.returnDate || "",
          veiculo: raw.veiculo || null,
          distanciaTotalKm: raw.totalKm || 0,
          valorCobrado: raw.finalValue || 0,
          dataEmissao: raw.emissaoDate || "",
          dataValidade: dataValidade,
          condicoesComerciais: {
            formaPagamento: raw.paymentTerms || "",
            incluso: raw.included || "",
            naoIncluso: raw.notIncluded || "",
            regrasGerais: raw.rules || ""
          },
          ...raw, // forward everything else for internal PDF
        };
      }

      
      function loadData() {
        if (window.__GARCIA_ORCAMENTO__) return sanitizeClientPayload(window.__GARCIA_ORCAMENTO__);
        const params = new URLSearchParams(window.location.search);
        const orcId = params.get("id");
        if (orcId) {
          try {
            const rawSession = localStorage.getItem("garcia_turismo_state_backup");
            if (rawSession) {
              const state = JSON.parse(rawSession);
              const found = (state?.data?.trips || []).find((o) => o.id === orcId);
              if (found) {
                // Get vehicles
                const veiculos = (state?.data?.vehicles || []).filter(v => (found.vehicleIds || []).includes(v.id));
                const veiculoNome = veiculos.map(v => `${v.nome || v.modelo}`).join(" + ");
                const capacidade = veiculos.reduce((acc, v) => acc + (Number(v.capacidade) || 0), 0) || 46;
                const layout = veiculos[0]?.layout || "onibus_46";
                const tipo = veiculos[0]?.tipo || "onibus";
                found.veiculo = { nome: veiculoNome, capacidade, layout, tipo };
                return sanitizeClientPayload(found);
              }
            }
          } catch (e) {
            console.warn(e);
          }
        }
        return null;
      }
      
      function render() {
        const doc = loadData();
        const root = document.getElementById("clientDocRoot");

        if (!doc) {
          root.innerHTML = `
            <div style="text-align:center; padding: 40px;">
              <h2 style="color: #dc2626;">Orçamento não encontrado</h2>
              <p style="color: #64748b;">Nenhum dado comercial disponível para esta proposta.</p>
            </div>
          `;
          window.__GARCIA_PDF_READY__ = true;
          return;
        }

        const totalPassageiros = doc.numeroPassageiros || doc.veiculo?.capacidade || 44;
        const valorPorPassageiro = totalPassageiros > 0 ? doc.valorCobrado / totalPassageiros : 0;
        const veiculoNome = doc.veiculo
          ? `${doc.veiculo.nome || doc.veiculo.modelo} (${doc.veiculo.capacidade || 46} Lugares)`
          : "Ônibus Executivo";

        const seatMapSvg = generateSeatMapSVG({
          tipo: doc.veiculo?.tipo || "onibus",
          layout: doc.veiculo?.layout || "onibus_46",
          capacidade: doc.veiculo?.capacidade || totalPassageiros,
          showLegend: true,
        });

        root.innerHTML = `
          <!-- Header -->
          <header class="header-wrap">
            <div>
              <img src="./assets/GARCIA TURISMO.png" alt="Garcia Turismo" class="logo-img" />
              <p style="font-size: 11px; color: #64748b; margin: 6px 0 0 0;">Transporte Executivo de Passageiros, Turismo &amp; Logística</p>
            </div>
            <div style="text-align: right;">
              <div class="validity-tag">
                ⏳ Válido até ${formatDateBR(doc.dataValidade)}
              </div>
              <p style="font-size: 12px; color: #64748b; margin: 6px 0 0 0;">
                Proposta nº <strong>#${escapeHtml(doc.numeroSequencial)}</strong> (Emissão: ${formatDateBR(doc.dataEmissao)})
              </p>
            </div>
          </header>

          <!-- Dados do Cliente e Viagem -->
          <div class="section-title">📍 Roteiro &amp; Detalhes da Viagem</div>
          <div class="info-grid">
            <div class="info-item">
              <p class="label">Cliente Solicitante</p>
              <p class="value">${escapeHtml(doc.cliente)}</p>
            </div>
            <div class="info-item">
              <p class="label">Veículo Designado</p>
              <p class="value">${escapeHtml(veiculoNome)}</p>
            </div>
            <div class="info-item">
              <p class="label">Embarque / Partida</p>
              <p class="value">${formatDateTimeBR(doc.dataHoraIda)}</p>
              <p style="font-size: 12px; color: #64748b;">${escapeHtml(doc.origem)}</p>
            </div>
            <div class="info-item">
              <p class="label">Retorno Previsto</p>
              <p class="value">${formatDateTimeBR(doc.dataHoraVolta)}</p>
              <p style="font-size: 12px; color: #64748b;">${escapeHtml(doc.destino)}</p>
            </div>
            ${
              doc.paradas
                ? `<div class="info-item" style="grid-column: span 2;">
                    <p class="label">Paradas / Itinerário Intermediário</p>
                    <p class="value">${escapeHtml(doc.paradas)}</p>
                  </div>`
                : ""
            }
          </div>

          <!-- Banner de Proposta Comercial (Apenas comercial, nunca custos) -->
          <div class="pricing-banner">
            <div>
              <p style="font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; margin: 0 0 4px 0;">Valor Total do Transporte</p>
              <div class="total-val">${money(doc.valorCobrado)}</div>
            </div>
            <div style="text-align: right;">
              <p style="font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; margin: 0 0 4px 0;">Rateio por Passageiro</p>
              <div style="font-size: 22px; font-weight: 700; color: #ffffff;">${money(valorPorPassageiro)} <span style="font-size: 12px; font-weight: normal; color: #94a3b8;">/ poltrona</span></div>
              <div class="seat-val">Capacidade contratada: ${totalPassageiros} lugares</div>
            </div>
          </div>

          <!-- Mapa de Poltronas -->
          <div class="section-title">🪑 Mapa de Poltronas do Veículo</div>
          <div class="seatmap-section">
            <p style="font-size: 12px; color: #64748b; margin-top: 0; margin-bottom: 12px; text-align: center;">
              Layout esquemático de poltronas com indicação de Janela, Corredor e Poltronas da Frente.
            </p>
            ${seatMapSvg}
          </div>

          <!-- Regras por Poltrona e Conforto -->
          <div class="section-title">⚠️ Regras de Bordo &amp; Conforto por Poltrona</div>
          <div class="rules-box">
            ${escapeHtml(doc.regrasViagem || "Bagagem permitida: 1 mala de até 20kg no bagageiro + 1 mochila de mão. Tolerância máxima de embarque: 15 minutos.")}
          </div>

          <!-- Condições Comerciais -->
          <div class="section-title">📋 Condições Comerciais &amp; Contratuais</div>
          <ul class="conditions-list">
            <li><strong>Forma de Pagamento:</strong> ${escapeHtml(doc.condicoesComerciais?.formaPagamento || "50% de sinal na confirmação e 50% até 24h antes do embarque.")}</li>
            <li><strong>Incluso no Pacote:</strong> ${escapeHtml(doc.condicoesComerciais?.incluso || "Veículo executivo com ar-condicionado, motorista qualificado, combustível, pedágios, taxas e seguro passageiro.")}</li>
            <li><strong>Não Incluso:</strong> ${escapeHtml(doc.condicoesComerciais?.naoIncluso || "Hospedagem, alimentação dos passageiros ou despesas em pontos turísticos.")}</li>
            <li><strong>Reserva:</strong> A reserva da data e do veículo fica garantida somente após a confirmação do pagamento do sinal.</li>
            <li><strong>Cancelamento:</strong> Cancelamentos com até 7 dias de antecedência têm devolução integral do sinal; após esse prazo, aplica-se retenção de custos operacionais.</li>
          </ul>

          <!-- Rodapé Institucional -->
          <footer class="footer-note">
            <div>
              <strong>Garcia Turismo Ltda</strong> · Petrolina-PE / Juazeiro-BA<br />
              Telefone/WhatsApp: (74) 99999-9999 · E-mail: contato@garciaturismo.com.br
            </div>
            <div style="text-align: right;">
              CNPJ: 00.000.000/0001-00 · Registro ANTT: Ativo<br />
              <em>Proposta gerada em conformidade com as normas da ANTT.</em>
            </div>
          </footer>
        `;

        window.__GARCIA_PDF_READY__ = true;
      }

      window.addEventListener("DOMContentLoaded", render);
    </script>
  </body>
</html>
