<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planilha de Custos &amp; Lucro (Uso Interno) — Garcia Turismo</title>
    <link rel="stylesheet" href="./styles/variables.css" />
    <link rel="stylesheet" href="./styles/main.css" />
    <link rel="stylesheet" href="./styles/dashboard.css" />
    <style>
      @page {
        size: A4;
        margin: 10mm 12mm;
      }
      body {
        background: #f1f5f9;
        color: #0f172a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 20px;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .internal-page {
        max-width: 860px;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 16px;
        padding: 32px 36px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        position: relative;
        overflow: hidden;
      }
      .watermark-banner {
        background: #fee2e2;
        color: #991b1b;
        border: 2px dashed #ef4444;
        border-radius: 10px;
        padding: 8px 16px;
        font-weight: 800;
        font-size: 12.5px;
        text-align: center;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        margin-bottom: 18px;
      }
      .header-wrap {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        border-bottom: 2px solid #e2e8f0;
        padding-bottom: 16px;
        margin-bottom: 20px;
        gap: 16px;
      }
      .logo-img {
        height: 48px;
        width: auto;
        object-fit: contain;
        display: block;
      }
      .kpi-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        margin-bottom: 22px;
      }
      .kpi-card {
        padding: 14px 16px;
        border-radius: 14px;
        border: 1px solid #e2e8f0;
        background: #f8fafc;
      }
      .kpi-card .kpi-label {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        color: #64748b;
        margin: 0 0 4px 0;
      }
      .kpi-card .kpi-value {
        font-size: 19px;
        font-weight: 800;
        margin: 0;
      }
      .table-costs {
        width: 100%;
        border-collapse: collapse;
        font-size: 12.5px;
        margin-bottom: 22px;
      }
      .table-costs th {
        background: #f1f5f9;
        text-align: left;
        padding: 9px 12px;
        font-weight: 700;
        color: #334155;
        border-bottom: 2px solid #cbd5e1;
        text-transform: uppercase;
        font-size: 11px;
        letter-spacing: 0.5px;
      }
      .table-costs td {
        padding: 9px 12px;
        border-bottom: 1px solid #e2e8f0;
        color: #1e293b;
      }
      .table-costs tr:last-child td {
        border-bottom: 2px solid #0f172a;
        font-weight: 800;
        background: #f8fafc;
      }
      .badge-fair {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 9999px;
        font-weight: 700;
        font-size: 12px;
      }
      .badge-green {
        background: #dcfce7;
        color: #166534;
        border: 1px solid #86efac;
      }
      .badge-yellow {
        background: #fef3c7;
        color: #92400e;
        border: 1px solid #fde68a;
      }
      .badge-red {
        background: #fee2e2;
        color: #991b1b;
        border: 1px solid #fca5a5;
      }
      .badge-gray {
        background: #f1f5f9;
        color: #475569;
        border: 1px solid #cbd5e1;
      }
      .diagnostics-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        background: #f8fafc;
        border-radius: 14px;
        padding: 16px;
        border: 1px solid #e2e8f0;
        margin-bottom: 22px;
        font-size: 12px;
      }
      .no-print-bar {
        max-width: 860px;
        margin: 0 auto 16px auto;
        display: flex;
        justify-content: flex-end;
      }
      @media print {
        body {
          background: #ffffff;
          padding: 0;
        }
        .internal-page {
          box-shadow: none;
          padding: 0;
          max-width: 100%;
        }
        .no-print-bar {
          display: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="no-print-bar">
      <button onclick="window.print()" class="rounded-2xl px-5 py-2.5 btn-primary font-semibold text-sm">
        Imprimir / Salvar Planilha Interna (PDF)
      </button>
    </div>

    <main class="internal-page" id="internalDocRoot">
      <p style="text-align: center; padding: 40px; color: #64748b;">Carregando relatório interno...</p>
    </main>

    <script type="module">
      import { calculateOrcamento, formatDateBR } from "./src/utils/orcamento-calculator.js";

      window.__GARCIA_PDF_READY__ = false;

      function money(val = 0) {
        return Number(val || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
      }

      function escapeHtml(val = "") {
        return String(val || "").replace(/[&<>'"]/g, (c) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          "'": "&#39;",
          '"': "&quot;",
        })[c]);
      }

      function loadData() {
        if (window.__GARCIA_ORCAMENTO__) {
          return window.__GARCIA_ORCAMENTO__;
        }
        const params = new URLSearchParams(window.location.search);
        const orcId = params.get("id");
        try {
          const rawSession = localStorage.getItem("garcia_turismo_state_backup");
          if (rawSession) {
            const state = JSON.parse(rawSession);
            const found = (state?.data?.trips || []).find((o) => !orcId || o.id === orcId);
            if (found) return found;
          }
          const fallbackCurrent = localStorage.getItem("garcia_turismo_current_orcamento");
          if (fallbackCurrent) {
            return JSON.parse(fallbackCurrent);
          }
        } catch (e) {
          console.warn(e);
        }
        return null;
      }

      function render() {
        const doc = loadData();
        const root = document.getElementById("internalDocRoot");

        if (!doc) {
          root.innerHTML = `
            <div style="text-align:center; padding: 40px;">
              <h2 style="color: #dc2626;">Orçamento não encontrado</h2>
              <p style="color: #64748b;">Nenhum dado encontrado para gerar a planilha interna.</p>
            </div>
          `;
          window.__GARCIA_PDF_READY__ = true;
          return;
        }

        const totalKm = Number(doc.totalKm ?? doc.distanciaKmPassageiros ?? doc.distanciaTotalKm ?? 0);
        const emptyKm = Number(doc.emptyKm ?? doc.distanciaKmDeslocamentoVazio ?? 0);
        const localDisplacementKm = Number(doc.localDisplacementKm || 0);
        const consumption = Number(
          doc.consumptionKmPerLiter ??
            doc.custoCombustivelConsumo ??
            doc.veiculo?.consumoKmPorLitro ??
            0,
        );
        const fuelPrice = Number(doc.fuelPrice ?? doc.custoCombustivelLitro ?? 6.2);
        const driver1Val = doc.driver1Value ?? doc.custos?.motorista1Valor ?? "";
        const driver2Val = doc.driver2Value ?? doc.custos?.motorista2Valor ?? 0;

        const vehicleConfigs =
          Array.isArray(doc.vehicleConfigs) && doc.vehicleConfigs.length > 0
            ? doc.vehicleConfigs
            : doc.veiculo
              ? [
                  {
                    id: doc.veiculoId || "v1",
                    nome: doc.veiculo.nome || doc.veiculo.modelo || "Veículo 1",
                    capacidade: Number(doc.veiculo.capacidade || 46),
                    consumoKmPorLitro: Number(doc.veiculo.consumoKmPorLitro || consumption),
                  },
                ]
              : [];

        const calc = calculateOrcamento({
          valorBruto: doc.baseValue,
          desconto: Number(doc.discount || 0),
          valorCobrado: Number(doc.finalValue ?? doc.valorCobrado ?? 0),
          manualBaseValue: doc.manualBaseValue,
          pricePerKm: Number(doc.pricePerKm || 0),
          vehiclesQty: Number(doc.vehiclesQty || 1),
          totalKm,
          emptyKm,
          localDisplacementKm,
          vehicles: vehicleConfigs,
          capacidadePassageiros: Number(doc.totalCapacity || doc.veiculo?.capacidade || doc.passengers || doc.numeroPassageiros || 46),
          passageirosPrevistos: Number(doc.passengers || doc.numeroPassageiros || 0),
          consumptionKmPerLiter: consumption,
          fuelPricePerLiter: fuelPrice,
          motorista1Tipo: doc.driver1Type || "viagem",
          motorista1Valor: driver1Val,
          motorista1Diarias: Number(doc.driver1Days ?? doc.durationDays ?? 1),
          motorista2Tipo: doc.driver2Type || "viagem",
          motorista2Valor: driver2Val,
          motorista2Diarias: Number(doc.driver2Days ?? doc.durationDays ?? 1),
          pedagios: Number(doc.tollsCost ?? doc.custos?.pedagios ?? 0),
          estacionamento: Number(doc.parkingCost ?? 0),
          hospedagem: Number(doc.lodgingCost ?? doc.custos?.hospedagem ?? 0),
          alimentacaoMotoristas: Number(doc.driverMealsCost ?? 0),
          antt: Number(doc.anttCost ?? doc.custos?.antt ?? 0),
          agua: Number(doc.waterCost ?? doc.custos?.agua ?? 0),
          seguro: Number(doc.insuranceCost ?? 0),
          outrosCustos: doc.otherCosts || doc.outrosCustos || [],
          costsConfirmedZero: Boolean(doc.costsConfirmedZero || driver1Val !== ""),
          requireCompleteCosts: true,
          metaMargemPercent: 50,
        });

        const badgeClass =
          calc.fairPrice.status === "incompleto"
            ? "badge-gray"
            : calc.fairPrice.status === "verde"
              ? "badge-green"
              : calc.fairPrice.status === "amarelo"
                ? "badge-yellow"
                : "badge-red";

        const outrosLinhas = (doc.otherCosts || doc.outrosCustos || [])
          .map(
            (item) => `
            <tr>
              <td>Despesa Extra: ${escapeHtml(item.nome || "Custo Adicional")}</td>
              <td>Lançamento adicional</td>
              <td style="text-align: right; font-weight: 600;">${money(item.valor || 0)}</td>
            </tr>
          `,
          )
          .join("");

        const fuelBreakdownText = (calc.vehicleFuelBreakdowns || [])
          .map(
            (b) =>
              `${escapeHtml(b.nome)}: ${b.operationalKm} km ÷ ${b.consumoKmPorLitro || "?"} km/L = ${b.liters.toFixed(2)} L`,
          )
          .join(" | ");

        root.innerHTML = `
          <div class="watermark-banner">
            🔒 USO EXCLUSIVO INTERNO — CONFIDENCIAL / PROIBIDO COMPARTILHAR COM CLIENTES
          </div>

          <header class="header-wrap">
            <div style="display: flex; align-items: center; gap: 14px;">
              <img src="./assets/garcia-turismo-report.png" alt="Garcia Turismo" class="logo-img" />
              <div>
                <h1 style="font-size: 20px; margin: 0; font-weight: 800; color: #0f172a;">
                  Planilha de Custos &amp; Diagnóstico de Margem
                </h1>
                <p style="font-size: 12.5px; color: #64748b; margin: 4px 0 0 0;">
                  Orçamento <strong>#${escapeHtml(doc.orcamentoNum || doc.numeroSequencial || "-")}</strong> · Emissão: ${escapeHtml(formatDateBR(doc.emissaoDate || doc.dataEmissao || doc.createdAt))}
                </p>
              </div>
            </div>
            <div style="text-align: right;">
              <span class="badge-fair ${badgeClass}">
                ${escapeHtml(calc.fairPrice.label)}${calc.custosIncompletos ? "" : ` (${calc.margemPercent.toFixed(1)}%)`}
              </span>
              <p style="font-size: 12px; color: #64748b; margin: 6px 0 0 0;">
                Cliente: <strong>${escapeHtml(doc.client || doc.cliente || "-")}</strong>
              </p>
            </div>
          </header>

          ${
            calc.custosIncompletos
              ? `<div style="background: #fffbeb; border: 1px solid #fde68a; color: #92400e; padding: 12px 16px; border-radius: 12px; font-size: 12.5px; margin-bottom: 18px;">
                  <strong>Custos incompletos — pendências identificadas:</strong> ${escapeHtml(calc.pendingItems.join(" • "))}
                </div>`
              : ""
          }

          <div class="kpi-grid">
            <div class="kpi-card">
              <p class="kpi-label">Valor Final</p>
              <p class="kpi-value" style="color: #0284c7;">${money(calc.valorCobrado)}</p>
            </div>
            <div class="kpi-card">
              <p class="kpi-label">Custos Diretos</p>
              <p class="kpi-value" style="color: #475569;">${money(calc.custoTotal)}</p>
            </div>
            <div class="kpi-card">
              <p class="kpi-label">Lucro Estimado</p>
              <p class="kpi-value" style="color: ${calc.custosIncompletos ? "#64748b" : calc.lucro >= 0 ? "#16a34a" : "#dc2626"};">
                ${calc.custosIncompletos ? "Custos incompletos" : money(calc.lucro)}
              </p>
            </div>
            <div class="kpi-card">
              <p class="kpi-label">Margem s/ Receita</p>
              <p class="kpi-value" style="color: ${calc.custosIncompletos ? "#64748b" : calc.lucro >= 0 ? "#16a34a" : "#dc2626"};">
                ${calc.custosIncompletos ? "Incompleto" : `${calc.margemPercent.toFixed(1)}%`}
              </p>
            </div>
          </div>

          <h3 style="font-size: 12.5px; font-weight: 800; text-transform: uppercase; color: #b91c1c; margin-bottom: 8px;">
            Planilha Detalhada de Custos Diretos
          </h3>
          <table class="table-costs">
            <thead>
              <tr>
                <th>Item de Custo</th>
                <th>Memória de Cálculo / Observação</th>
                <th style="text-align: right;">Valor (R$)</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>Combustível (${calc.litrosCombustivel.toFixed(2)} L)</td>
                <td>${fuelBreakdownText} × ${money(fuelPrice)}/L</td>
                <td style="text-align: right; font-weight: 600;">${money(calc.custosDetalhados.combustivelCents / 100)}</td>
              </tr>
              <tr>
                <td>1º Motorista</td>
                <td>${doc.driver1Type === "dia" ? `${Number(doc.driver1Days ?? 1)} diária(s) × ${money(driver1Val || 0)}` : "Cobrança por viagem"}</td>
                <td style="text-align: right; font-weight: 600;">${money(calc.custosDetalhados.motorista1Cents / 100)}</td>
              </tr>
              ${
                calc.custosDetalhados.motorista2Cents > 0
                  ? `<tr>
                      <td>2º Motorista</td>
                      <td>${doc.driver2Type === "dia" ? `${Number(doc.driver2Days ?? 1)} diária(s) × ${money(driver2Val || 0)}` : "Cobrança por viagem"}</td>
                      <td style="text-align: right; font-weight: 600;">${money(calc.custosDetalhados.motorista2Cents / 100)}</td>
                    </tr>`
                  : ""
              }
              <tr>
                <td>Pedágios e Estacionamento</td>
                <td>Pedágios: ${money(calc.custosDetalhados.pedagiosCents / 100)} · Estacionamento: ${money(calc.custosDetalhados.estacionamentoCents / 100)}</td>
                <td style="text-align: right; font-weight: 600;">${money((calc.custosDetalhados.pedagiosCents + calc.custosDetalhados.estacionamentoCents) / 100)}</td>
              </tr>
              <tr>
                <td>Hospedagem e Alimentação de Motoristas</td>
                <td>Hospedagem: ${money(calc.custosDetalhados.hospedagemCents / 100)} · Alimentação: ${money(calc.custosDetalhados.alimentacaoMotoristasCents / 100)}</td>
                <td style="text-align: right; font-weight: 600;">${money((calc.custosDetalhados.hospedagemCents + calc.custosDetalhados.alimentacaoMotoristasCents) / 100)}</td>
              </tr>
              <tr>
                <td>ANTT / Taxas e Água / Kit Bordo</td>
                <td>ANTT: ${money(calc.custosDetalhados.anttCents / 100)} · Água/Lanches: ${money(calc.custosDetalhados.aguaCents / 100)}</td>
                <td style="text-align: right; font-weight: 600;">${money((calc.custosDetalhados.anttCents + calc.custosDetalhados.aguaCents) / 100)}</td>
              </tr>
              ${
                calc.custosDetalhados.seguroCents > 0
                  ? `<tr>
                      <td>Seguro Viagem</td>
                      <td>Seguro de passageiros</td>
                      <td style="text-align: right; font-weight: 600;">${money(calc.custosDetalhados.seguroCents / 100)}</td>
                    </tr>`
                  : ""
              }
              ${outrosLinhas}
              <tr>
                <td>TOTAL DE CUSTOS DIRETOS</td>
                <td>Km operacional total da frota: ${calc.totalOperationalKm} km</td>
                <td style="text-align: right; color: #dc2626; font-size: 15px;">${money(calc.custoTotal)}</td>
              </tr>
            </tbody>
          </table>

          <h3 style="font-size: 12.5px; font-weight: 800; text-transform: uppercase; color: #b91c1c; margin-bottom: 8px;">
            Indicadores Operacionais &amp; Ponto de Equilíbrio
          </h3>
          <div class="diagnostics-grid">
            <div>
              <p style="color: #64748b; margin: 0 0 2px 0;">Mínimo Sugerido (Meta 50%):</p>
              <p style="font-size: 15px; font-weight: 800; color: #d97706; margin: 0;">
                ${calc.custosIncompletos ? "Custos incompletos" : money(calc.precoSugeridoMeta)}
              </p>
            </div>
            <div>
              <p style="color: #64748b; margin: 0 0 2px 0;">Ponto de Equilíbrio:</p>
              <p style="font-size: 15px; font-weight: 800; color: #1e293b; margin: 0;">
                ${calc.custosIncompletos ? "Custos incompletos" : `${calc.pontoEquilibrioPassageiros} passageiro(s)`}
              </p>
            </div>
            <div>
              <p style="color: #64748b; margin: 0 0 2px 0;">Preço por Passageiro / Poltrona:</p>
              <p style="font-size: 14px; font-weight: 800; color: #0284c7; margin: 0;">
                ${calc.precoPorPassageiro > 0 ? `${money(calc.precoPorPassageiro)} / pass.` : "-"} · ${calc.precoPorPoltrona > 0 ? `${money(calc.precoPorPoltrona)} / poltrona` : "-"}
              </p>
            </div>
            <div>
              <p style="color: #64748b; margin: 0 0 2px 0;">Custo por KM (${calc.totalOperationalKm} km):</p>
              <p style="font-size: 14px; font-weight: 700; color: #334155; margin: 0;">
                ${calc.custosIncompletos ? "Incompleto" : `${money(calc.custoPorKm)} / km`}
              </p>
            </div>
            <div>
              <p style="color: #64748b; margin: 0 0 2px 0;">Receita por KM (${calc.totalOperationalKm} km):</p>
              <p style="font-size: 14px; font-weight: 700; color: #334155; margin: 0;">${money(calc.receitaPorKm)} / km</p>
            </div>
            <div>
              <p style="color: #64748b; margin: 0 0 2px 0;">Lucro por KM:</p>
              <p style="font-size: 14px; font-weight: 700; color: ${calc.custosIncompletos ? "#64748b" : calc.lucroPorKm >= 0 ? "#16a34a" : "#dc2626"}; margin: 0;">
                ${calc.custosIncompletos ? "Incompleto" : `${money(calc.lucroPorKm)} / km`}
              </p>
            </div>
          </div>

          <div style="margin-top: 22px; padding-top: 12px; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-between; font-size: 11px; color: #64748b;">
            <span>Garcia Turismo — Sistema de Gestão Financeira, Viagens e Frota</span>
            <span>Gerado em ${new Date().toLocaleString("pt-BR")}</span>
          </div>
        `;

        window.__GARCIA_PDF_READY__ = true;
      }

      window.addEventListener("DOMContentLoaded", render);
    </script>
  </body>
</html>
